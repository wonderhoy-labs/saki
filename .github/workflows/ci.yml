name: CI

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    checks:
        uses: wonderhoy-labs/.github/.github/workflows/checks.yml@main

    # Saki runs on macOS and Linux, on x86_64 and ARM. Windows has no BLE L2CAP API, so it isn't built.
    rust:
        uses: wonderhoy-labs/.github/.github/workflows/rust.yml@main
        with:
            package: saki
            apt-packages: libdbus-1-dev pkg-config
            targets: >-
                [
                  {"os": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu"},
                  {"os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu"},
                  {"os": "macos-latest", "target": "aarch64-apple-darwin"},
                  {"os": "macos-latest", "target": "x86_64-apple-darwin"}
                ]

    android:
        uses: wonderhoy-labs/.github/.github/workflows/android.yml@main
        with:
            name: saki
            env-prefix: SAKI
            rust-targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
        secrets:
            KEYSTORE_BASE64: ${{ secrets.SAKI_KEYSTORE_BASE64 }}
            KEYSTORE_PASSWORD: ${{ secrets.SAKI_KEYSTORE_PASSWORD }}
            KEY_ALIAS: ${{ secrets.SAKI_KEY_ALIAS }}
            KEY_PASSWORD: ${{ secrets.SAKI_KEY_PASSWORD }}

    release:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [checks, rust, android]
        permissions:
            contents: write
            id-token: write
            attestations: write
        uses: wonderhoy-labs/.github/.github/workflows/release.yml@main
        with:
            title: Saki
