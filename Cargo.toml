[workspace]
resolver = "3"
members = ["crates/saki-core", "crates/saki", "crates/saki-jni"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/wonderhoy-labs/saki"
publish = false
rust-version = "1.91"

[workspace.dependencies]
bytes = "1.12"
futures = "0.3"
libc = "0.2"
netstack-smoltcp = "0.2"
# netstack-smoltcp leaves congestion control off. Turning this feature on gives every socket Reno.
smoltcp = { version = "0.14", default-features = false, features = ["socket-tcp-reno"] }
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.54", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
